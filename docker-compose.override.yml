# 개발용 override (docker compose 가 자동으로 합친다). 운영에서는 `docker compose -f docker-compose.yml up -d` 로 이 파일을 쓰지 않는다.
services:
  # 호스트의 가상환경(pytest, MCP 서버, 관리 스크립트)이 DB에 붙을 수 있게 로컬호스트로만 공개한다.
  db:
    ports:
      - "127.0.0.1:${LAWCA_DB_PORT:-5433}:5432"
    networks: [data, edge]      # 포트 공개를 위해 internal 이 아닌 네트워크가 하나 필요하다(개발 전용)

  # 인증서 신뢰 설정 없이 브라우저로 시험할 수 있게 평문 HTTP 를 127.0.0.1:8081 에만 연다.
  proxy:
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.dev", "--adapter", "caddyfile"]
    ports:
      - "127.0.0.1:${LAWCA_DEV_HTTP_PORT:-8081}:80"
