services:
  db:
    image: pgvector/pgvector:pg17
    container_name: lawca-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LAWCA_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: lawca_owner
      POSTGRES_PASSWORD: ${LAWCA_OWNER_PASSWORD}
      POSTGRES_DB: ${LAWCA_DB_NAME:-lawca}
      LAWCA_READER_PASSWORD: ${LAWCA_READER_PASSWORD}
      LAWCA_AUDIT_PASSWORD: ${LAWCA_AUDIT_PASSWORD}
    volumes:
      - lawca_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawca_owner -d ${LAWCA_DB_NAME:-lawca}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lawca_pgdata:
