# 사이트 공통 설정(HTTPS 사이트와 개발용 HTTP 사이트가 함께 import 한다)
encode zstd gzip

# 업로드 본문 상한(앱의 LAWCA_MAX_REQUEST_MB 보다 약간 크게). 더 크면 프록시에서 먼저 413으로 끊는다.
request_body {
	max_size 1100MB
}

header {
	X-Content-Type-Options nosniff
	X-Frame-Options DENY
	Referrer-Policy same-origin
	Permissions-Policy "camera=(), microphone=(), geolocation=()"
	# 화면은 같은 오리진의 스크립트·스타일만 쓴다. (진행률 막대의 style 속성 때문에 style-src-attr 만 인라인 허용)
	Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
	-Server
}

reverse_proxy api:8000 {
	# 큰 업로드·느린 회선을 고려해 넉넉하게
	transport http {
		read_timeout 15m
		write_timeout 15m
	}
}
